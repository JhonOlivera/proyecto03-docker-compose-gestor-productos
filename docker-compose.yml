services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tienda2
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - db-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - gestor-net

  api:
    build: .
    image: ${DOCKERHUB_USER}/gestor-productos:1.0
    environment:
      DB_URL: jdbc:mysql://db:3306/tienda2
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - api-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gestor-net

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - gestor-net

volumes:
  mysql-data:
  api-logs:
  db-backups:

networks:
  gestor-net:
    driver: bridge
